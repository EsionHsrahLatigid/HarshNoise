name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin build and smoke tests
    uses: EsionHsrahLatigid/juce-ci/.github/workflows/juce-cmake.yml@98fcb96e64011725ed842941b350afe013e9ba7d
    with:
      runs-on: macos-14
      dependency-cache-key: juce-8.0.15
      cmake-options: >-
        -DHARSHNOISE_BUILD_PLUGIN=ON
        -DHARSHNOISE_BUILD_TESTS=ON
      build-targets: >-
        HarshNoise_Artifacts
        HarshNoiseSmokeTests
      artifact-name: HarshNoise-macOS
      artifact-path: |
        artifacts/Release/VST3/
        artifacts/Release/AU/
        artifacts/Release/Standalone/
